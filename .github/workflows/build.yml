name: Publish Datapack
on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7.0.1
      with:
        show-progress: false
      
    - name: Zip the datapack
      # You may pin to the exact commit or the version.
      # uses: TheDoctor0/zip-release@b57d897cb5d60cb78b51a507f63fa184cfe35554
      uses: TheDoctor0/zip-release@0.7.6
      with:
        # Filename for archive
        filename: villagers-rebalanced-${{ github.ref_name }}.zip # default is release.zip
        # Base path for archive files
        path: . # optional, default is .
        # Working directory before zipping
        directory: datapack # optional, default is .
        # List of excluded files / directories
        #exclusions: # optional, default is 
        # List of excluded files / directories with recursive wildcards (only applies on Windows with `zip` type)
        #recursive_exclusions: # optional, default is 
        # Provide any custom parameters to the zipping command
        #custom: # optional, default is 
        # Tool to use for archiving
        #type: # optional, default is zip
        # An extra command that will run before zipping
        #command: # optional, default is 

    - name: Publish
      uses: Kira-NT/mc-publish@v3.3.2
      with:
        # If your build toolchain doesn't place the resulting artifacts directly in build/libs/,
        # you will need to manually specify what you want to upload:
        # files: build/libs/fabric/!(*-@(dev|sources|javadoc)).jar

        # 2.2.6-beta+mc26.3
        name: ${{ github.event.release.tag_name }}
        version: ${{ github.event.release.name }}

        loaders: |
          datapack
        #environment: server

        game-versions: |
          26.3

        files: |
          datapack/*.zip

        # Only include this section if you wish to publish your assets to Modrinth.
        modrinth-id: 45wbQbB9
        modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

        # Only include this section if you wish to publish your assets to GitHub.
        github-token: ${{ secrets.GH_TOKEN }}
